<!doctype html>
<html
  lang="en"
  data-composition-id="hook"
  data-composition-variables='[
    { "id": "days", "type": "number", "label": "Days to race", "default": 5, "min": 1, "step": 1 },
    { "id": "word", "type": "string", "label": "Slam word", "default": "BACK OFF." },
    { "id": "tag", "type": "string", "label": "Disclosure tag", "default": "" },
    { "id": "line", "type": "string", "label": "Line above the slam word", "default": "" },
    { "id": "pill", "type": "string", "label": "Pill text (default: N days before my A race)", "default": "" },
    { "id": "flipFrom", "type": "number", "label": "Slam number start (with flipTo: rolls from this...)", "default": null },
    { "id": "flipTo", "type": "number", "label": "...to this, turning green", "default": null },
    { "id": "meLabel", "type": "string", "label": "Marker pointing at you (empty hides it)", "default": "" },
    { "id": "meX", "type": "number", "label": "Marker left (px)", "default": 70, "step": 10 },
    { "id": "meY", "type": "number", "label": "Marker top (px)", "default": 760, "step": 10 },
    { "id": "mode", "type": "enum", "label": "Layout", "default": "presenter", "options": [{ "value": "presenter", "label": "Over the presenter" }, { "value": "card", "label": "Full-screen card (voiceover)" }] }
  ]'
>
  <body>
    <template>
      <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
        <style>
          #root {
            position: absolute;
            inset: 0;
            background: transparent;
          }
          #hook-box {
            position: absolute;
            left: 60px;
            right: 60px;
            top: 252px;
            padding: 30px 42px 34px;
            border-radius: 32px;
            background: rgba(11, 15, 20, 0.86);
            font-family: var(--font);
            color: var(--ink);
          }
          #hook-line {
            font-size: 58px;
            font-weight: 700;
            line-height: 1.05;
          }
          #hook-stop {
            font-size: 150px;
            white-space: nowrap;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.04em;
            color: var(--red);
            transform-origin: 0% 60%;
          }
          /* Voiceover version: no presenter, so the hook is a full-screen card. */
          .hook-card-only {
            display: none;
          }
          #root.card-mode .hook-card-only {
            display: block;
          }
          #root.card-mode #hook-box {
            top: 560px;
            padding: 44px 48px 48px;
            background: var(--panel);
            border: 3px solid var(--line);
          }
          #root.card-mode #hook-line {
            font-size: 68px;
          }
          #root.card-mode #hook-stop {
            font-size: 146px;
          }
          #hook-label {
            position: absolute;
            left: 84px;
            top: 480px;
          }
          #hook-race {
            position: absolute;
            left: 84px;
            right: 84px;
            top: 1040px;
            font-family: var(--font);
            font-size: 34px;
            font-weight: 700;
            color: var(--muted);
          }
          #hook-me {
            position: absolute;
            display: none;
            align-items: center;
            gap: 14px;
            font-family: var(--font);
          }
          #hook-me-pill {
            padding: 12px 24px;
            border-radius: 999px;
            background: var(--lime);
            color: var(--ground);
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 0.04em;
          }
          #hook-me-arrow {
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-left: 28px solid var(--lime);
          }
          #hook-days {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 24px;
            border-radius: 999px;
            background: var(--lime);
            color: var(--ground);
            font-size: 34px;
            font-weight: 900;
          }
        </style>

        <div id="hook-clip" class="clip" data-start="0" data-duration="60" data-track-index="0">
          <div class="r-ground hook-card-only"></div>
          <div id="hook-tag" class="r-tag">AI-generated digital twin</div>
          <div id="hook-label" class="r-label hook-card-only">AI coach &middot; intervals.icu</div>
          <div id="hook-box">
            <div id="hook-line">My AI coach told me to</div>
            <div id="hook-stop">BACK OFF.</div>
            <div id="hook-days"><span id="hook-days-n">5</span> days before my A race</div>
          </div>
          <div id="hook-race" class="hook-card-only">Masters TT &middot; 7 Nov</div>
          <div id="hook-me"><div id="hook-me-pill"></div><div id="hook-me-arrow"></div></div>
        </div>

        <script>
          (function () {
            var vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};
            document.getElementById("hook-days-n").textContent = vars.days != null ? vars.days : 5;
            if (vars.word) document.getElementById("hook-stop").textContent = vars.word;
            if (vars.tag) document.getElementById("hook-tag").textContent = vars.tag;
            if (vars.line) document.getElementById("hook-line").textContent = vars.line;
            if (vars.pill) document.getElementById("hook-days").textContent = vars.pill;
            var flip = vars.flipFrom != null && vars.flipTo != null;
            if (flip) document.getElementById("hook-stop").textContent = reel.format(vars.flipFrom, 0, true);
            var me = document.getElementById("hook-me");
            if (vars.meLabel) {
              document.getElementById("hook-me-pill").textContent = vars.meLabel;
              me.style.display = "flex";
              me.style.left = (vars.meX != null ? vars.meX : 70) + "px";
              me.style.top = (vars.meY != null ? vars.meY : 760) + "px";
            }
            var card = vars.mode === "card";
            if (card) {
              document.getElementById("root").classList.add("card-mode");
              document.getElementById("hook-tag").textContent = "AI-generated voiceover";
            }

            // Frame 0 is the thumbnail: the whole line is already on screen.
            // STOP lands from slightly large, then everything holds still.
            var tl = gsap.timeline({ paused: true });
            tl.fromTo("#hook-stop", { scale: 1.14 }, { scale: 1, duration: 0.45, ease: "expo.out" }, 0.05);
            tl.fromTo("#hook-days", { opacity: 0.0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power4.out" }, 0.55);
            if (card) {
              // No face to punch in on: the card itself cuts tighter on "back off!".
              tl.set("#hook-box", { scale: 1.05, transformOrigin: "50% 50%" }, 2.4);
              tl.fromTo("#hook-race", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.4);
            }
            if (vars.meLabel) {
              // Point the viewer at you while the hook is read, then get out of the way.
              tl.fromTo("#hook-me", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0.4);
              tl.to("#hook-me", { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.6);
            }
            if (flip) {
              // The thumbnail shows the bad number; it rolls to the race-day number mid-hook.
              reel.count(tl, "#hook-stop", { from: vars.flipFrom, to: vars.flipTo, decimals: 0, signed: true, at: 2.2, duration: 1.1, ease: "power2.inOut" });
              tl.to("#hook-stop", { color: "#3ddc84", duration: 0.5, ease: "power2.inOut" }, 2.7);
            }
            window.__timelines["hook"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
